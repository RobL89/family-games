<!doctype html>
<html lang="en-GB" data-skin="sticker">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game shell mockup</title>
  <!-- Review mockup only (REVIEW.md, pass 2, G2 and G4). Not part of the app.
       Shows a game (Kriss Kross, untouched) in a frame under a slim sticker-book bar,
       and the shared end-of-round panel. Add ?panel=1 to show the panel. -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/theme.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }

    /* The bar: home, the child, their stars. Games with levels add a "Level 2" chip. */
    .bar {
      position: relative; z-index: 2; flex: none; display: flex; align-items: center; gap: .55rem;
      padding: .4rem .75rem; border-bottom: var(--outline) solid var(--line);
    }
    .bar .back { width: 2.5rem; height: 2.5rem; padding: .55rem; }
    .bar .face { width: 2.6rem; height: 2.6rem; padding: .12rem; box-shadow: none; }
    .bar .kid-name { flex: 1; min-width: 0; font-size: 1.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .total { font-size: 1.25rem; rotate: none; box-shadow: none; }
    .chip {
      flex: none; font-size: 1.1rem; padding: .05em .8em;
      background: color-mix(in srgb, #2E8FD0 35%, #fff); clip-path: var(--tape-clip);
    }

    iframe { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: #060a14; }

    /* The end-of-round panel: slides up over the lower part, so the finished game stays in view. */
    .round[hidden], .chip[hidden] { display: none; }
    .round { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: 0 .7rem .9rem; }
    .round-card {
      width: min(30rem, 100%); display: flex; flex-direction: column; align-items: center; gap: .35rem;
      padding: .9rem 1rem 1.1rem; text-align: center; background: var(--card);
      border: calc(var(--outline) * 1.3) solid var(--line); border-radius: 1.2em; box-shadow: 0 -.2em 1.4em rgba(0, 0, 0, .35);
      animation: pop .45s ease;
    }
    .round-card .sum { display: flex; flex-direction: column; align-items: center; gap: .35rem; }
    .round-card h2 { margin: 0; font-size: 2.1rem; font-weight: inherit; line-height: 1; }
    .round-card .stars { font-size: 2.7rem; }
    .round-card .sub { margin: 0; font-size: 1.25rem; color: var(--muted); }
    .new { display: flex; align-items: center; gap: .6rem; font-size: 1.2rem; }
    .new .slot { width: 3rem; height: 3rem; }
    .acts { display: flex; justify-content: center; align-items: flex-end; gap: 1.3rem; margin-top: .35rem; }
    .act { display: flex; flex-direction: column; align-items: center; gap: .3rem; font-size: 1.15rem; }
    .act .circle {
      display: grid; place-items: center; width: 3.9rem; height: 3.9rem; color: #fff; border-radius: 50%;
      border: var(--outline) solid var(--line); box-shadow: var(--shadow);
    }
    .act .circle svg { width: 52%; height: 52%; }
    .act.next .circle { width: 4.9rem; height: 4.9rem; background: #2FA34A; }
    .act.again .circle { background: #2E8FD0; }
    .act.home .circle { background: #E5533D; }

    /* Wide screens: a low strip along the bottom, so the finished game stays in view. */
    @media (min-width: 56rem) and (min-aspect-ratio: 4/3) {
      .round-card { width: auto; max-width: 100%; flex-direction: row; gap: 2rem; padding: .7rem 1.6rem; }
      .round-card .sum { display: grid; justify-items: start; gap: .2rem; text-align: left; }
      .round-card .stars { font-size: 2.2rem; }
      .acts { margin-top: 0; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <button class="back" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.2l9 7.6c.6.5.2 1.4-.6 1.4H19v7.3c0 .8-.7 1.5-1.5 1.5H14v-5.5h-4V21H6.5c-.8 0-1.5-.7-1.5-1.5v-7.3H3.6c-.8 0-1.2-.9-.6-1.4z"/></svg></button>
    <span class="face"><span class="disc" id="face"></span></span>
    <span class="kid-name">Sam</span>
    <span class="chip" id="chip" hidden></span>
    <span class="total" id="total"></span>
  </header>
  <iframe id="game" title="Kriss Kross" src="../../games/kriss-kross/index.html"></iframe>

  <div class="round" id="round" hidden>
    <div class="round-card" role="dialog" aria-label="Round over">
      <div class="sum">
        <h2>Amazing!</h2>
        <span id="round-stars"></span>
        <p class="sub">+3 stars · Week 3 spellings</p>
      </div>
      <div class="new"><span class="slot got" style="--bc:#2E8FD0;--r:-6deg" id="sticker"></span>New sticker!</div>
      <div class="acts">
        <span class="act again"><span class="circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M19 12a7 7 0 1 1-2.1-5"/><path fill="currentColor" d="M20.5 3.5v6h-6z"/></svg></span>Again</span>
        <span class="act next"><span class="circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 4.5v15l12-7.5z"/></svg></span>Next list</span>
        <span class="act home"><span class="circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.2l9 7.6c.6.5.2 1.4-.6 1.4H19v7.3c0 .8-.7 1.5-1.5 1.5H14v-5.5h-4V21H6.5c-.8 0-1.5-.7-1.5-1.5v-7.3H3.6c-.8 0-1.2-.9-.6-1.4z"/></svg></span>Home</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { injectAvatars, avatarSVG } from '../../shared/avatars.js';
    import { injectIcons, icon, stars } from '../../shared/icons.js';
    injectIcons();
    injectAvatars();
    const q = new URLSearchParams(location.search);
    document.getElementById('face').innerHTML = avatarSVG('fox');
    document.getElementById('total').innerHTML = `${icon('s-star', 'st on')}<span>${q.get('stars') || 27}</span>`;
    document.getElementById('round-stars').innerHTML = stars(3);
    document.getElementById('sticker').innerHTML = icon('b-star');
    if (q.get('chip')) { const c = document.getElementById('chip'); c.textContent = q.get('chip'); c.hidden = false; }
    if (q.get('panel')) document.getElementById('round').hidden = false;
  </script>
</body>
</html>
