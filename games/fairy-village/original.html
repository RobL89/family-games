<!--
FAIRY VILLAGE - notes for anyone editing this file

What it is: a fairy puzzle adventure. The player's fairy lives in a red toadstool in an empty village. Each fairy world has five puzzles; each solved puzzle grows one petal, and five petals bring that world's fairy home to a new house in the village.
Who it's for: ages 5 to 9, on phones, tablets and computers. Three levels per explorer: Little Sprite (age 5), Clever Pixie (age 7), Nimble Nymph (age 9). Every puzzle has a version for each level.
Learning goals: counting and number, measuring, data and charts, shapes and symmetry, patterns, sorting, phonics, rhyme and spelling, music (pitch, rhythm, memory), early science (floating and sinking, seasons, weather, the body and senses, gears, levers, strong shapes, circuits, magnets, colour mixing), early coding (step-by-step programs and loops).
Built so far (phases 1 to 10 of 11, plus the first phase 11 game changes: one new fairy per phase from phase 5, phase 7 balancing, phone and tablet fixes and a Full screen button, phase 8 split the page into files, phase 9 petal pots and the first two fairy games, phase 10 the other seven games): "Who's playing?" picker (up to 8 explorers), fairy maker, the village, the worlds map, and all nine fairy worlds:
- Bloom, Flower fairy (forest glade): garden jigsaw, petal pattern, plant the seeds, garden words, sort the flowers.
- Ripple, Water fairy (lily pond, shell house): pipe route to the lily, float or sink, fill the jugs (Little Sprite's jug has unnumbered lines a quarter apart, a longer one at half), shape stepping stones, missing letters.
- Breeze, Weather fairy (cloud tops, cloud house on a stalk): weather count (Little Sprite taps the number), tally and bar chart, seasons and months, rainbow jigsaw, cloud shapes and mirror lines, weather words.
- Jingle, Music fairy (bluebell hill, bluebell house): copy a bell tune, finish a rhythm or build one by ear (drum, clap, shaker), high or low (tap the bell), rhymes and verses, bluebell band jigsaw.
- Ginger, Doctor fairy (inside a hollow-tree clinic, acorn cottage with a leaf-plaster sign): plaster three different patients or name the bone, senses, count heartbeats, pack the doctor’s bag (shaped kit into shaped spaces; solid shapes for Nimble Nymph), body words.
- Twinkle, Star fairy (night meadow, little observatory): join the constellation dots by counting, space words (match word and picture; Earth/planet and Sun/star never offered together), hidden sky shapes, letter stars and a space word search, night sky jigsaw.
- Crumble, Baker fairy (teapot kitchen, teapot house): share cupcakes or cake slices and fractions, pay with UK coins and give change, ice the cake with the right number of cherries or chocolate chips (count, make the total, double, half, groups), recipe words and reading, cake jigsaw.
- Rivet, Engineer fairy (cog mill by the stream, cog-wheel cottage with a waterwheel): turn the gears to spin the waterwheel (gear sizes, which way; Gear chains: put the gears on the right pegs, then say which way the waterwheel turns), balance the seesaw (heavier or lighter, missing weights), build a bridge from shapes and triangles (fill the holes, brace the squares, count triangles and beams with a picture of the bridge asked about), label the tools, building site jigsaw.
- Gizmo, Inventor fairy (glass-jar lab, glass-jar workshop with a propeller): light the bulb (Little Sprite puts one wire in the one gap; close the switch, spot why a circuit doesn't work), magnet test (guess then watch, metal or not, which metals stick), program the robot ladybird (arrows, turns, repeat loops), mix potion colours (two colours, recipes, lighter and darker shades), invention jigsaw.
Each fairy's arrival and move-in, house and fairy taps (a house comes alive, then opens her house menu; Bloom: bee; Ripple: frog hops; Breeze: weathervane and rainbow; Jingle: bells swing and play a tune; Ginger: windows glow with a heartbeat; Twinkle: dome turns and a shooting star streaks past; Crumble: spout puffs steam and a cupcake pops out; Rivet: waterwheel speeds up, roof cogs whirr, chimney puffs; Gizmo: propeller spins and the jar hops), facts, Read to me and sounds.
Fairy games (phases 9 and 10): tapping a fairy, her house or her petal pot opens her house menu: Play my game / Play my puzzles. Each fairy has her own petal pot (drawn by her house). She moves in with 5 petals in it; after that her flower restarts grey, replaying her puzzles turns petals pink (they stay pink between visits), and when all 5 are pink the player picks the flower and all 5 go in her pot. One petal buys one go of her game; no pot limit. Every game has a start card, Ready... Go!, pause (button, Esc or P, or leaving the tab), an end card and a best score per explorer and fairy with a "New best!" moment. Little Sprite starts slower and speeds up more gently; Nimble Nymph starts faster. Built: Bloom's Flower catch (move the basket, three misses wilt three petals, score flowers caught) and Ripple's Lilypad ride (3D, seen from just behind Ripple like other endless runners: the river runs to the horizon and things grow as they come; steer round rocks, jump logs that float on the water (green up-arrow sign), duck branches and bridges that hang over it with water showing beneath (purple down-arrow sign); swipe, tap, arrow keys or the four buttons; score seconds), Breeze's Leaf ride (hold anywhere, the Blow button, Space or up arrow to blow the leaf up, let go to drift down; branches from above, treetops from below, rain clouds; the ground or anything touched ends it; gentle start; score seconds), Jingle's Bell lanes (3, 4 or 5 lanes by level; the notes play well-known out-of-copyright songs and nursery rhymes in turn, the name shown as each starts; like a guitar game, higher notes go further right and each hit rings the song's real note; quick notes left out for Little Sprite; a tap a little early counts more generously than a little late; tap a lane, its number or A S D F G as a note reaches its bell; tapping with no note just rings softly; three missed notes; score notes) and Ginger's Clinic rush (woodland patients show their problem on themselves and close up in a bubble, with a patience flower; drag the right thing from the doctor's kit along the bottom onto the patient, or tap it then the patient (keys 1 to 7, arrows, Space): cut knee = Clean then Plaster, spots = Medicine, fever = Thermometer then Bed, broken arm = X-ray then Bandage (all four at every level; Little Sprite is slower); after a first step the bubble shows what was found; a wooden sign shows each problem and what it needs, in order (on a wide screen it stands on the right, one problem per row, with the cushions moved left; otherwise it hangs above the patients); patients walk in and out along a path behind the cushions and can only be treated once seated; the wrong thing costs that patient patience; three wilted flowers; score patients made better), Twinkle's Meteor sparkler (she floats mid-sky; space rocks drift in from every side and curve towards her; tap or click where to zap, or the mouse aims and arrow keys turn her with Space to zap; big rocks break into two middle, middle into two small; no big rocks for Little Sprite; three bumps; score rocks sparkled, every piece counts) and Rivet's Pipe rush (endless: a 7 by 5 board, 5 by 7 on a tall phone, so every screen has the same 35 squares, with a green exit pipe on the far side on a random row; water that flows out of the exit goes on to a new board (the old one slides away, the exit's row becomes the new tap's row, a shorter countdown, Board 2, 3...); tap a square to lay the next pipe from the queue of three, tap a dry pipe to swap it; a countdown, then the water flows square by square, faster over time; tap the tap to start it early; arrow keys and Space too; 2 boulders for Clever Pixie, 4 for Nimble Nymph; the water reaching an open end spills and ends it; score pipes filled, a cross filled both ways counts twice), Crumble's Bake and merge (calm, untimed: drag a bake onto the same bake touching it, corners count, to make the next one up: flour, dough, bun, cupcake, layer cake, celebration cake; or drag it to an empty square; after every go a bag of flour lands on a free square, not the one just emptied; Nimble Nymph sometimes gets a bowl of dough; a celebration cake is carried off to Crumble's party table beside the tray (under the bake ladder on a tall phone), freeing its square, and the table counts them; tap then tap, and arrow keys with Space, work too; tray 5 by 4 for Little Sprite, 4 by 4 otherwise; ends when the tray is full and no touching bakes match; score bakes made) and Gizmo's Fizz drop (calm, untimed: slide along the top of the glass jar and let go, or click, or arrow keys and Space, to drop a ball; it snaps into a honeycomb 8 across; three or more of a colour touching fizz away, and balls no longer joined to the floor go too; a new row bubbles up from the bottom every few drops, a little more often over time; 3 colours for Little Sprite, 4 otherwise, each with its own white symbol; a dotted line shows where the ball will land; ends when a ball sits above the rim; score balls fizzed).
Where things live (separate files in this one artifact since phase 8; same link and saves):
- index.html: these notes, Notes for Rob, the revision log, the page shell (all screens and pop-ups), then the scripts in order: core.js, fairies/bloom.js, ripple, breeze, jingle, ginger, twinkle, crumble, rivet, gizmo, games/kit.js, then one file per game, then startGame(). style.css: all the styles.
- core.js: what every fairy shares: helpers, gradients, saves, Read to me, sounds (also the bell, drum, clap, shaker and heartbeat sounds), screens, Who's playing, fairy maker, the village and its LAYOUTS, the worlds map (WORLDS), the flower picker, puzzle runner and results, shared puzzle types (jigsaw, multi/rounds, option buttons, sorter, orderer, speller), gear and arrow drawing, the fairy-found scene.
- fairies/<name>.js: one fairy each: her gradients (addDefs), art, house, world scene, jigsaw picture, puzzles, pictures (into PICS2; Bloom's into PICS), petal icons (PZICON) and her FAIRIES entry (facts, flowerBase, puzzles), then FAIRY_ORDER.push. core.js also holds the petal pots, replay flower and house menu.
- games/kit.js: the shared game helper (game screen, loop, controls, levels, start, pause and end cards, best scores, canvas drawing helpers); its header says how a game file plugs in. games/<game>.js: one game each, adding GAMES[fairy id] (flower-catch.js for Bloom, lilypad-ride.js for Ripple, leaf-ride.js for Breeze, bell-lanes.js for Jingle, clinic-rush.js for Ginger, meteor-sparkler.js for Twinkle, bake-and-merge.js for Crumble, pipe-rush.js for Rivet, fizz-drop.js for Gizmo). Each game's speeds or sizes by level are in a settings list at its top.
- Rules: the files are plain scripts sharing one set of names, so a new name must not repeat one in another file. A fairy file uses only core.js; anything a second fairy needs moves to core.js. Pictures and gradients are shared lists any fairy can use by name. A new fairy = a new file and script line in index.html, plus her LAYOUTS and WORLDS entries in core.js.
Look and tone: bright storybook world. Houses, fairies and scenes are drawn to look 3D (rounded shading, highlights, soft shadows) from one fixed view, with no camera moving. A fairy's garden and puzzle screens sit on a picture of her world; puzzle words, numbers and answers sit on white cards so they stay clear. Fredoka headings, Nunito text. Gentle, encouraging words.
Design decisions not to change:
- No hints anywhere. A wrong answer earns no petal; the player sees an encouraging message and goes back to the fairy's flower to pick again. Puzzles with several rounds end on the first wrong answer.
- Most puzzles have three rounds ("1 of 3") to earn the petal, at every level; jigsaws are one go (multi() repeats a one-round puzzle, rounds() runs varied ones). Village fairies are the same size as the player's fairy.
- Five petals bring each fairy home. Worlds can be visited in any order. Jigsaws: 9, 20 and 36 pieces by level.
- Fairies, names and houses are our own originals (Bloom, Ripple, Breeze, Jingle, Ginger, Twinkle, Crumble, Rivet, Gizmo). Nothing borrowed from books or TV.
- A fairy's puzzle picker is her flower: tap a petal to play that puzzle; solved petals turn pink. Bloom's flower has a stem, Ripple's sits on a lily pad, Breeze's on a cloud.
- Pipe puzzle: the water only runs when the player taps Turn on the water, so it is a single try. The same goes for Turn the handle (gears), Roll the cart, Test the bridge, Test the circuit and the ladybird's Go button.
- Every gear has the same size teeth (pitch radius 2.4 x teeth), so any two gears mesh and turn at the right speeds. Turning directions are called clockwise and anticlockwise.
- Paint mixing, not light: red + yellow = orange, blue + yellow = green, red + blue = purple. Magnets: only iron and steel stick (aluminium, copper and gold do not).
- Music and heartbeat puzzles play their own sounds even when Sounds is off, because the sound is the puzzle. Bells and the heart also light up so the tune and beats can be watched. Bell lanes rings its bells the same way.
- No red cross symbol on the clinic or kit (it is a protected emblem); Ginger uses hearts and leaf plasters.
- Seasons follow the UK (spring March to May, summer June to August, autumn September to November, winter December to February).
- Village paths are drawn in layers so new paths join the plaza and each other as one surface; houses lower on the screen are drawn over the ones behind.
- No box or outline when a house, fairy or petal is tapped; a soft glow shows focus only for keyboard users.
- Internal fairy ids stay as first named (the Flower fairy Bloom is "petal" in code and saves) so saves keep working.
- Read to me starts on for Little Sprite and can be switched in the village bar.
- Petals from one fairy's puzzles only pay for her game, one petal a go, spent when Start or Play again is pressed. The games are just for fun, with no hints or learning (Clinic rush's help sign is a guide to the rules, by request); every pattern in them can be dodged or caught. Crumble's and Gizmo's games are calm and untimed; their pressure comes from the tray or jar filling, not a clock.
Saves: this browser only (localStorage key "fairy-village-v1"), one record per explorer: petals per fairy, moved (who lives in the village), pots (petals in each pot; older saves get 5 for each fairy already home), replay (her pink petals after she moved in) and best (best game score per fairy). A sturdier save may come later. Phones: checked on small and large phones (both ways up) and tablets. On a phone held sideways, spacing tightens and pop-ups lay out side by side. Puzzle parts never squash; the screen scrolls instead. A Full screen button sits at the right of every top bar (not the Who's playing screen); it is hidden where the browser doesn't allow full screen, such as on iPhones.
Not built yet: the rest of phase 11 balances game speeds and scores and checks phones. Details are in the game plan doc.
-->
