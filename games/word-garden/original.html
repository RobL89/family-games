<!DOCTYPE html>
<!--
WORD GARDEN - notes for anyone editing this file

WHAT IT IS: a spelling and phonics garden. Every word, sound or tricky word is a plant that grows one stage a day
when it is right: seed, sprout, bud, flower. One garden and save per explorer.
WHO: children from Reception (ELS phonics) to Year 6 (school spelling lists and common exception words); today a
Reception child and a Year 2 child. Mostly a computer, sometimes a phone (sideways). Screens are 1280 x 800, scaled.
LOOK: storybook garden, wooden signs, cream letter tiles. Fredoka headings, Andika for every word a child reads or
spells. Question screens show the child's own garden place softened behind (backdropHTML). All drawn in code: map
(mapArt), flower garden and vegetable patch (fgGeom, flowerScene), shed, greenhouse, listening garden (LG_ZONE), pond.

RULES NOT TO CHANGE
- At most one stage a day. Wrong = down one stage (never below seed), back later in the session. Checks after
  1 week, 2 weeks, 1 month, then every 3 months; a missed check droops. No wrong buzzers. Not tied to test days.
- Year groups (YEARS, yrN): each explorer has a year, picked when made; Grown-ups > Spelling lists > "Move up to ..."
  each September. Places open by year (AREA_YEAR) and stay open: Reception listening garden and potting shed; Year 1
  flower garden and vegetable patch; Year 2 greenhouse and pond (water lilies, two lists a page); Year 3 orchard (each
  list a fruit tree, apple/pear/plum/cherry in turn, two a page; map trees top right). Years 4-6 places: phase 11. Moving Reception -> Year 1 is the garden gate: spelling places open; her tricky words stay in the shed.
- Spelling: seed = Magic mirror; sprout = Tile builder, then Fill the tricky bit; bud and checks = Hear and type
  (only it makes a flower). Lists go through "Where shall these seeds grow?" (only open places). A word already in
  the garden moves into the new list's bed with its stage (never planted twice), so every list word is tested with
  the list; a flower is checked that day, ahead of other checks. Each place has room
  for 4 lists, plus 1 every 40 grown words (seed-check beds and moved tricky words don't count). 8 goes a watering.
- Where words come from (pkMode, Grown-ups > Spelling lists): 'week' = word packets one a week (the default for new
  Year 1-6 explorers), 'hand' = packets when a grown-up sends one, 'school' = only typed-in school lists, no packets
  (switching drops waiting packets and, if a grown-up agrees, planted packet words; a Year 2 garden then gets the
  built-in autumn lists, SCHOOL, grown: plantAutumn). The new-garden form asks packets or school lists for Years 1-6.
- Earlier years already grown (plantPast): a new explorer in Year 2+ gets every earlier year's packets plus its word
  list as flowers (bed kind 'past'): Y1 flower/veg, Y2 greenhouse/pond, Y3 and Y4 orchard (until Y4 places exist).
  First checks spread over 4+ months, then every 3 months. They count for visitors and room, but their beds don't
  use up list room. No seed check for new explorers any more.
- Word packets (PK_DATA, phase 9): 128 packets for Years 1-6, an Appendix 1 spelling pattern each plus some statutory
  words. Weekly packets never catch up missed weeks. Grown-ups > Word packets edits words, turns packets off and adds
  own ones (ROSTER.pk, shared by all explorers). Year 2 up get ' and - keys.
- Milestone visitors are OFF for now (VIS_ON = false): they all arrived at once for older years; to be rethought.
  The code is kept (bee 10 ... duck 250, pond ones from Year 2). Reception gardens keep all their animals.
- Reception (a garden with els): six listening-garden places of 12 sounds, tricky words in pots; 5 goes, all spoken,
  praise only; new gardens start at Autumn 1 week 1 (ELS_START) and grown-ups move her ELS week on. Reception pacing
  lasts to the end of Year 1 (recSty).
- Listening garden and shed are open for every year. A garden that didn't start in Reception gets every Reception
  sound and tricky word already grown (plantRecPast, recPast:true; hasRec vs hasSnd). Grown-ups code 1234.

RECEPTION YEAR (ELS): Autumn 1 to Summer 2. Summer 1 has no new sounds: its longer words are early spelling words
('ew:<word>', sounds in EW) in the word patch, page 2 of the listening garden (bed spot 'patch', a bed per week);
Look and build (seed), then Hear and build with two extra tiles (makes a flower). Phase 5 sounds and the snow ow
(ow2) reuse the recording of the sound they spell (SND[id][1]); ew and u-e use sounds/yoo.wav (from Oxford Owl); the six places hold 72 sounds and 71 are used.
SOUNDS: sounds/<id>.wav, one per ELS sound. Clips from the school's ELS videos, except t p i n m g r h b f l v w x y z ch
dh oo1 ar ur or ow oi ear air ure and yoo, which are from Oxford Owl's phonics chart (chosen 25 Nov). For family use only:
don't make this artifact public. Words and sentences use the device voice; animals and places use Web Audio.
SAVES (browser): wordGarden.players.v1 = {v:1, players:[{id,name,year,look}], last}; wordGarden.player.<id> =
{v:3, id, name, year ('rec','y1'..'y6'), yrSeen, look, words, beds, pending, seedCheck, tests (practice, trimmed), els?,
gateDone, pkMode ('week','hand','school'), pkUsed, pkDay, autumn, school, schoolTests ...}; plantPast words have past:true.
School lists are lasting records, never trimmed, separate from packets: school = [{id, set 'YYYY-MM-DD', added, planted?,
words:[{w exactly as given, t, s}]}]; schoolTests = [{id, list, taken 'YYYY-MM-DD', results:[{w, ok}] for every word}].
window.WordGarden (for the launcher; the grown-up screens use the same functions): players(), schoolLists(pid),
schoolTests(pid), addSchoolList(pid, {id?, set?, words}), recordSchoolTest(pid, {list, taken?, results}) -> {ok, id} or
{ok:false, error}. A repeated list id is not added twice; the same list and date entered again replaces that result.
v1 and v2 saves are converted when read (v2: list beds, waiting lists and school tests become records).
The roster may carry pk: {ed, own} (packet edits). bed.area: flower, veg, green, pond, orchard, listen, shed.
LAUNCHER: ids: switchPlayer, maker, nameInput, waterBtn, seedBtn, plantBtn, testBtn, grownBtn. The page needs its
sounds/ folder beside it. All sound is HTML audio, speechSynthesis and Web Audio (normal browser audio).
TREEHOUSE: the only place for games (GAMES). Right answers on garden words give sunbeams (3 = a stage, never a flower).
Games: Spelling detective, Letter catcher, Robot talk (Rec-Y1, ELS clips, no letters), Tile builder (Rec), Tricky bit, and
for Year 1 up Word ladder (top word always shown; help Lots Y1-2 / Some Y3-4, clues / On my own Y5-6, any word in LAD_DICT),
Sorting baskets (SORTS; Listen and sort from Y2), Hedge word search (garden words, topped up from packets). Busy bee for all
(rhymes only, words not pictures: Rec-Y1 same spelling, Rec only words of sounds she knows; Y2 other spellings; Y3+ look-alike
traps). Year 2 up: Ghost letters (silent letters: spot, then type), Homophone sentences (tips; snail race or calm), Sunflower
tower (garden words only; Practice 10 / Championship 3 misses), Word builder (BUILD_BOARDS by year). No game keeps scores.
Speech says only whole words and sentences (a Suffix machine saying word parts was tried and taken out).
Treehouse: up to 10 cards a screen in two rows; arrows page sideways (S.gPage); More games is always last.
NOT BUILT YET: herb garden and sunflowers (Y4), woodland (Y5), glasshouse (Y6); calmer look for older
children; picture words for the Phase 5 sounds (they use Sound pick until then); -es, -le and soft c (on the plan only).
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Garden (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: warm storybook garden, praise-first, nothing harsh
   IDEA: a child's own garden where every word is a plant
   PICTURE: side-on flower beds and a slanted garden map
   COLOUR and TYPE: sky blue, meadow green, soil brown, flower brights; Fredoka + Andika
   LAYOUT: fixed 1280 x 800 stage scaled to fit any screen */
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#8DBB6E;overflow:hidden;font-family:Fredoka,system-ui,sans-serif;color:#3B2A1E;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;background:#D8EDF4;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
.word{font-family:Andika,sans-serif}
.screen{position:absolute;inset:0;display:none}.screen.on{display:block}
.btn{height:52px;padding:0 20px;border-radius:16px;border:2px solid #C9B79E;background:#FFFBF2;font-size:18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.green{border:none;background:#3E8E4A;box-shadow:0 5px 0 #2A6634;color:#fff}
.btn.blue{border:none;background:#3C86C4;box-shadow:0 5px 0 #2A5F8E;color:#fff}
.btn.big{height:64px;padding:0 28px;border-radius:20px;font-size:23px}
.btn.small{height:44px;font-size:16px;padding:0 14px;border-radius:12px}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.key:focus-visible,.area:focus-visible,.plant:focus-visible{outline:4px solid #F6C945;outline-offset:2px}
.top{position:absolute;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:6}
.top .side{display:flex;align-items:center;gap:10px}
.chip{background:rgba(255,251,242,.95);border-radius:20px;padding:8px 20px 8px 10px;box-shadow:0 2px 0 #9DBA7E;display:flex;align-items:center;gap:12px}
.chip.plain{padding:8px 20px}
.chip h1{margin:0;font-size:26px;font-weight:600;line-height:1.1}
.chip small{display:block;font-size:16px;color:#6A5543}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.bottom{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:16px;z-index:6;pointer-events:none}.bottom>*{pointer-events:auto}
.ico{width:22px;height:22px;flex:none}

/* who's playing */
#who{background:#A6CD86}
#who h1{position:absolute;left:0;right:0;top:70px;margin:0;text-align:center;font-size:52px;font-weight:600}
#who .sub{position:absolute;left:0;right:0;top:136px;text-align:center;font-size:22px;color:#4A6A34}
.cards{position:absolute;left:90px;right:90px;top:200px;display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.card{width:230px;height:250px;border-radius:28px;border:3px solid #8A5A3B;background:#FFF8E7;box-shadow:0 6px 0 #8A5A3B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:26px;font-weight:600}
.card small{font-size:16px;font-weight:500;color:#6A5543}
.card.new{border-style:dashed;background:rgba(255,248,231,.7);box-shadow:none}
.who-gu{position:absolute;right:30px;top:24px}

/* map */
#map{background:#A6CD86}
.area{position:absolute;border:none;background:none;padding:0;display:flex;justify-content:center}
.plaque{background:#F6D9A8;border:3px solid #8A5A3B;border-radius:10px;padding:4px 14px;display:flex;flex-direction:column;align-items:center;color:#3B2A1E}
.plaque b{font-size:22px;font-weight:600}
.plaque span{font-size:15px}
.plaque.locked{background:#EADFC9;border-color:#A08A70;color:#6A5543}
.seedcard{position:absolute;left:40px;bottom:24px;width:440px;height:86px;background:#FFFBF2;border:3px solid #3C86C4;border-radius:18px;padding:6px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 0 #2A5F8E;text-align:left;font-size:18px;z-index:6}
.seedcard.new{border-color:#E2B33C;box-shadow:0 5px 0 #C9971C}.seedcard.new b{color:#8A5A00}
.seedcard svg{width:52px;height:62px;flex:none}.seedcard b{display:block;font-size:24px;font-weight:600;color:#2A5F8E}
.mapnote{position:absolute;right:40px;bottom:28px;max-width:470px;background:#FFFBF2;border:3px solid #E2B33C;border-radius:18px;padding:14px 18px;font-size:20px;font-weight:600;box-shadow:0 4px 0 #C9971C}

/* garden */
#garden{background:#D8EDF4}
.scenewrap{position:absolute;inset:0;overflow:hidden;cursor:grab}
.scene{position:absolute;left:0;top:0;height:800px;transition:transform .5s ease}
.scene.drag{transition:none}
.plant{position:absolute;border:none;background:none;padding:0;display:block}
.plant svg{display:block;width:100%;height:100%}
.plabel{position:absolute;transform:translateX(-50%);padding:1px 8px;background:#FFF8E7;border:2px solid #9A6B45;border-radius:6px;white-space:nowrap;pointer-events:none;line-height:1.3}
.bedsign{position:absolute;background:#F6D9A8;border:2px solid #8A5A3B;border-radius:6px;padding:2px 6px;font-size:14px;font-weight:600;line-height:1.15;text-align:center;transform:rotate(-3deg);pointer-events:none}
.freebed{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFF3DD;pointer-events:none}
.freebed b{font-size:20px;font-weight:600}.freebed span{font-size:15px}
.pop{animation:pop .7s var(--d,0s) both}
@keyframes pop{0%{transform:scale(0) translateY(30px);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.pan{position:absolute;bottom:26px;z-index:7}
.pan.l{left:24px}.pan.r{right:24px}
#bubble{position:absolute;z-index:8;max-width:300px;background:#FFFBF2;border:3px solid #8A5A3B;border-radius:16px;padding:10px 14px;font-size:17px;line-height:1.3;box-shadow:0 4px 0 rgba(138,90,59,.4);display:none;pointer-events:none}
#bubble .word{font-size:24px;font-weight:700;display:block}

/* play */
#play{background:linear-gradient(#DCEFF5,#EAF5E0 60%,#CFE6B7)}
.pips{display:flex;gap:6px;align-items:center;background:rgba(255,251,242,.95);border-radius:20px;padding:10px 16px;box-shadow:0 2px 0 #9DBA7E}
.pip{width:20px;height:26px}
.instr{position:absolute;left:0;right:0;top:100px;text-align:center;font-size:30px;font-weight:600;margin:0}
.speak{position:absolute;left:580px;top:150px;width:120px;height:120px;border-radius:50%;border:none;background:#3C86C4;box-shadow:0 6px 0 #2A5F8E;display:flex;align-items:center;justify-content:center}
.speak svg{width:64px;height:64px}
.speaklbl{position:absolute;left:0;right:0;top:282px;text-align:center;font-size:18px;color:#4A6A34}
.ans{position:absolute;left:290px;width:700px;height:100px;top:320px;background:#FFFFFF;border:4px solid #9A6B45;border-radius:22px;display:flex;align-items:center;justify-content:center;font-family:Andika,sans-serif;font-size:64px;letter-spacing:2px}
.ans.m{top:388px;height:88px;font-size:56px}
.caret{display:inline-block;width:4px;height:60px;background:#3E8E4A;margin-left:4px;animation:blink 1s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.kb{position:absolute;left:0;right:0;top:492px;display:flex;flex-direction:column;align-items:center;gap:9px}
.kr{display:flex;gap:9px}
.key{width:84px;height:66px;border-radius:14px;border:2px solid #C9B79E;border-bottom-width:5px;background:#FFFBF2;font-family:Andika,sans-serif;font-size:36px;display:flex;align-items:center;justify-content:center;padding:0}
.key:active{transform:translateY(2px);border-bottom-width:3px}
.kb.caps .key[data-k]{text-transform:uppercase}
.key.wide{width:120px}
.key.cap{width:200px;font-family:Fredoka,sans-serif;font-size:20px;font-weight:600}
.kb.caps .key.cap{background:#FFF3C4;border-color:#E2B33C}
.key.check{width:300px;border:none;background:#3E8E4A;box-shadow:0 5px 0 #2A6634;color:#fff;font-family:Fredoka,sans-serif;font-size:26px;font-weight:600}
.fb{position:absolute;left:150px;right:150px;top:494px;height:286px;background:#FFFBF2;border:4px solid #8DBB6E;border-radius:28px;display:flex;align-items:center;gap:24px;padding:20px 30px;box-shadow:0 6px 0 rgba(78,138,58,.35)}
.fb.no{border-color:#E2B33C;box-shadow:0 6px 0 rgba(201,151,28,.35)}
.fb .fbplant{width:150px;height:210px;flex:none}
.fb .fbtext{flex:1}
.fb h2{margin:0 0 6px;font-size:36px;font-weight:600}
.fb p{margin:0 0 10px;font-size:21px}
.fb .try{font-size:20px;color:#6A5543}
.fb .try .word{font-size:30px}
.fb .corr{font-size:54px;line-height:1.1}
.ok{color:#2F8F46}.bad{color:#D9730D;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:8px}
.tk{color:#E0457B;font-weight:700}
.tk.ok{color:#2F8F46}.tk.bad{color:#D9730D}.ok.tk,.bad.tk{background:#FCE0EA;border-radius:8px}
.sparkle{position:absolute;pointer-events:none;font-size:28px;animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.2);opacity:0}}

/* magic mirror */
.steps{position:absolute;left:50px;top:110px;display:flex;flex-direction:column;gap:10px}
.step{width:150px;height:46px;border-radius:14px;background:rgba(255,251,242,.7);border:2px solid #C9B79E;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:20px;font-weight:600;color:#8A7766}
.step.now{background:#FFF3C4;border-color:#E2B33C;color:#3B2A1E;transform:scale(1.06)}
.step.done{color:#2F8F46;border-color:#8DBB6E}
.mirror{position:absolute;left:370px;top:86px;width:540px;height:292px}
.mirror svg{position:absolute;inset:0}
.glass{position:absolute;left:44px;top:34px;width:452px;height:224px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mword{transition:filter .9s ease,opacity .9s ease;white-space:nowrap}
.fog{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.98),rgba(244,250,252,.92) 45%,rgba(230,242,247,.9));opacity:0;transition:opacity .9s ease}
.mirror.fogged .fog{opacity:1}.mirror.fogged .mword{filter:blur(14px);opacity:.5}
.lookbar{position:absolute;left:0;right:0;top:420px;display:flex;flex-direction:column;align-items:center;gap:22px}
.lookbar p{margin:0;font-size:26px;text-align:center;line-height:1.35}
.lookbar .row{display:flex;gap:18px}

/* grow */
#grow{background:linear-gradient(#D8EDF4,#D8EDF4 40%,#A6CD86 40%)}
#grow h1{position:absolute;left:0;right:0;top:56px;margin:0;text-align:center;font-size:46px;font-weight:600}
#grow .sub{position:absolute;left:0;right:0;top:118px;text-align:center;font-size:24px}
.tiles{position:absolute;left:70px;right:70px;top:190px;height:470px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px 18px}
.tile{width:120px;height:200px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.tile .pl{position:absolute;left:10px;top:0;width:100px;height:140px}
.tile .tag{position:absolute;top:40px;right:-10px;background:#F6C945;border-radius:999px;padding:2px 10px;font-size:15px;font-weight:600;opacity:0;animation:fadeIn .4s calc(var(--d) + .9s) forwards}
.tile .lbl{padding:1px 8px;background:#FFF8E7;border:2px solid #9A6B45;border-radius:6px;font-size:19px;white-space:nowrap}
.grew .old{animation:fadeOut .5s var(--d) forwards}
.grew .new{opacity:0;transform-origin:50% 100%;animation:popUp .7s calc(var(--d) + .35s) forwards}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes popUp{0%{opacity:0;transform:scaleY(.4)}70%{opacity:1;transform:scaleY(1.1)}100%{opacity:1;transform:scaleY(1)}}

/* grown-ups */

.gtop{position:absolute;left:24px;right:24px;top:18px;display:flex;justify-content:space-between;align-items:center}
.gtop h1{margin:0;font-size:32px;font-weight:600}
.tabs{position:absolute;left:24px;top:86px;display:flex;gap:8px}
.tab{height:46px;padding:0 18px;border-radius:14px 14px 0 0;border:2px solid #C9B79E;border-bottom:none;background:#EADFC9;font-size:18px;font-weight:600}

.gbody{position:absolute;left:24px;right:24px;top:132px;bottom:20px;background:#FFFBF2;border:2px solid #C9B79E;border-radius:0 18px 18px 18px;overflow:auto;padding:22px 28px;font-size:17px;user-select:text;-webkit-user-select:text}

.gnote{color:#6A5543;font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stage-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* modal */
.mback{position:absolute;inset:0;background:rgba(59,42,30,.38);display:flex;align-items:center;justify-content:center;z-index:40}
.modal{background:#FFFBF2;border-radius:30px;padding:30px 36px;width:640px;max-height:740px;overflow:auto;box-shadow:0 8px 0 #A08A70;text-align:center}
.modal h2{margin:0 0 10px;font-size:34px;font-weight:600}

.modal .row{justify-content:center;margin-top:18px}
.modal input[type=text]{font:30px Andika,sans-serif;padding:10px 16px;width:100%;border:3px solid #C9B79E;border-radius:16px;text-align:center}

/* ===== WOODEN LOOK (wooden signs, scroll banners, wood-framed boards, cream letter tiles) ===== */
:root{
  --ink:#4A2C17;--wood-dd:#5E3B22;--wood-d:#8A5A3B;--cream:#FFF8E8;--parch:#FBEFD2;
  --grain:repeating-linear-gradient(177deg,rgba(110,60,25,0) 0 6px,rgba(110,60,25,.11) 6px 8px,rgba(110,60,25,0) 8px 15px,rgba(255,240,210,.18) 15px 16px,rgba(110,60,25,0) 16px 22px);
  --plank:var(--grain),linear-gradient(#F2D29C,#DCA967);
  --plank-old:var(--grain),linear-gradient(#E6DAC4,#CDBB9C);
  --frame:repeating-linear-gradient(90deg,#B97C45 0 11px,#A86D3A 11px 14px,#C38952 14px 27px,#AE733F 27px 30px);
  --board:var(--grain),linear-gradient(#C99258,#B37A43);
  --nails:radial-gradient(circle at 11px 50%,#6B4226 0 3px,rgba(0,0,0,0) 3.6px),radial-gradient(circle at calc(100% - 11px) 50%,#6B4226 0 3px,rgba(0,0,0,0) 3.6px);
  --tile:linear-gradient(#FFFDF7,#F6E8CC);
}
/* wood-framed panel: cream inside, wooden frame, dark outline */
.modal,.fb,.ans,.twcard,.seedcard,.card:not(.new),.acard,.scard,.mapnote,.tboard{
  border:10px solid transparent!important;
  background:linear-gradient(var(--cream),var(--cream)) padding-box,var(--frame) border-box!important;
  box-shadow:0 0 0 3px var(--wood-dd),0 7px 0 3px var(--wood-dd)!important}
.modal{border-width:14px!important;background:linear-gradient(var(--parch),var(--cream)) padding-box,var(--frame) border-box!important;box-shadow:0 0 0 3px var(--wood-dd),0 9px 0 3px var(--wood-dd),0 18px 40px rgba(59,42,30,.35)!important}
.acard.locked,.scard.full{box-shadow:0 0 0 3px #8C7A64!important;filter:saturate(.4)}

/* signs: carved planks with nails */
.plaque,.chip,.pips,.spotsign{background:var(--nails),var(--plank);border:3px solid var(--wood-dd);color:var(--ink);box-shadow:0 4px 0 var(--wood-dd),0 6px 10px rgba(59,42,30,.18)}
.plaque{position:relative;border-radius:9px;padding:5px 30px 6px;white-space:nowrap;text-shadow:0 1px 0 rgba(255,244,220,.7)}
.plaque b{font-size:23px;line-height:1.15}.plaque span{font-size:15px;color:#6A4429}
.plaque::after{content:'';position:absolute;left:50%;top:100%;width:12px;height:16px;margin-left:-6px;background:linear-gradient(90deg,#7A4B2F,#5E3B22);z-index:-1}
.area{z-index:1}
.plaque.locked{background:var(--nails),var(--plank-old);border-color:#7E6A55;color:#6A5543;box-shadow:0 4px 0 #7E6A55}
.plaque.locked span{color:#7E6A55}
.chip{border-radius:16px;padding:6px 22px 6px 8px}
.chip.plain{padding:6px 34px}
.chip h1{color:var(--ink);text-shadow:0 1px 0 rgba(255,244,220,.7)}
.chip small{color:#6A4429}
.avatar{background:#FFF8E8!important;border:4px solid #3E9AA5;box-shadow:0 2px 0 var(--wood-dd)}
.count{display:inline-flex;align-items:center;gap:6px;margin-top:2px;background:rgba(255,248,232,.85);border:2px solid #B88E62;border-radius:999px;padding:1px 12px 1px 4px;font-size:16px;color:#6A4429}
.count b{font-size:20px;color:var(--ink)}
.pips{border-radius:16px;padding:9px 30px}
.spotsign{border-radius:9px;padding:4px 26px;color:var(--ink)}
.bedsign{background:var(--plank);border-color:var(--wood-dd);color:var(--ink);box-shadow:0 2px 0 var(--wood-dd)}
.plabel,.tile .lbl{background:var(--tile);border-color:var(--wood-d);box-shadow:0 2px 0 var(--wood-d)}

/* buttons: plain ones become light wood; coloured ones keep their colour with a dark edge */
.btn:not(.green):not(.blue):not([style*="background"]){background:var(--plank);border:2px solid var(--wood-dd);box-shadow:0 4px 0 var(--wood-dd);color:var(--ink)}
.btn.green,.btn.blue,.btn[style*="background"],.key.check{outline:3px solid rgba(255,248,232,.9);outline-offset:-6px}
.btn:focus-visible{outline:4px solid #F6C945;outline-offset:2px}

/* seed card on the map */
.seedcard{padding:2px 14px!important}
.seedcard b{color:var(--ink)!important}.seedcard.new b{color:#8A5A00!important}

/* scroll banner for instructions */
.instr{left:0;right:0;margin:0 auto;width:fit-content;max-width:1060px;top:90px;padding:7px 54px 8px;font-size:27px;line-height:1.25;color:var(--ink);
  background:linear-gradient(90deg,rgba(201,163,110,.45),rgba(0,0,0,0) 34px,rgba(0,0,0,0) calc(100% - 34px),rgba(201,163,110,.45)),linear-gradient(#FFF9EA,#F5E3BE);
  border:3px solid #B48A5A;border-radius:12px;box-shadow:0 4px 0 rgba(94,59,34,.45),0 8px 16px rgba(59,42,30,.15)}
.instr::before,.instr::after{content:'';position:absolute;top:-8px;bottom:-8px;width:22px;border-radius:11px;background:linear-gradient(90deg,#D9B784,#F3DDB1 45%,#C9A36E);border:3px solid #B48A5A}
.instr::before{left:-14px}.instr::after{right:-14px}
.speaklbl{left:0;right:0;margin:0 auto;width:fit-content;padding:1px 14px;border-radius:999px;background:rgba(255,248,232,.92);color:#3F5E2A;top:280px}
.speak{box-shadow:0 0 0 5px #FFF8E8,0 0 0 8px var(--wood-dd),0 8px 0 8px var(--wood-dd)}

/* answer board: letters as cream tiles */
.ans{top:314px;height:112px;padding:0 14px;gap:6px;letter-spacing:0;font-size:50px;border-radius:22px!important}
.ans.m{top:384px;height:104px;font-size:46px}
.ans>span:not(.caret){flex:0 1 60px;min-width:0;height:78px;display:flex;align-items:center;justify-content:center;background:var(--tile);border:2px solid #B88E62;border-bottom-width:6px;border-radius:11px;margin:0;line-height:1}
.ans.m>span:not(.caret){height:72px}
.ans .blank{border:3px dashed #3C86C4!important;border-bottom-width:3px!important;background:rgba(232,243,252,.8)!important;color:#2A5F8E}
.ans .blank.cur{background:#FFF3C4!important;border-color:#E2B33C!important;border-style:solid!important}
.ans .bad{text-decoration-thickness:3px;text-underline-offset:6px}
.caret{height:56px}
.pkt{position:absolute;left:172px;top:318px;width:98px;height:112px;filter:drop-shadow(0 4px 0 rgba(94,59,34,.45))}
.pkt svg{width:100%;height:100%;display:block}

/* keyboard on a wooden board */
.kb{left:0;right:0;margin:0 auto;width:fit-content;top:488px;gap:8px;padding:12px 16px 14px;border-radius:22px;background:var(--board);box-shadow:0 0 0 3px var(--wood-dd),0 7px 0 3px var(--wood-dd),0 12px 20px rgba(59,42,30,.2)}
.kr{gap:8px}
.key{height:60px;background:var(--tile);border-color:#9A6B45;border-width:2px 2px 5px;color:var(--ink)}
.key.cap{background:var(--plank)}

/* tile builder: slots on a board, cream letter tiles */
.slots{left:0;right:0;margin:0 auto;width:fit-content;max-width:1240px;top:304px;padding:12px 14px;border-radius:20px;background:var(--board);box-shadow:0 0 0 3px var(--wood-dd),0 6px 0 3px var(--wood-dd)}
.slot{background:rgba(255,248,232,.55);border-color:#FFF3DD}
.slot.full{background:var(--tile);border-color:#B88E62;border-bottom-color:#9A6B45}
.tray{left:0;right:0;margin:0 auto;width:fit-content;max-width:1160px;height:auto;top:466px;padding:14px 18px;border-radius:20px;background:rgba(255,248,232,.72);border:3px dashed rgba(138,90,59,.55)}
.ltile{background:var(--tile);border-color:#B88E62;border-bottom-color:#9A6B45}

/* Reception choices and pictures */
.choice,.sl{background:var(--tile);border-color:#B88E62;border-bottom-color:#9A6B45;box-shadow:0 6px 12px rgba(59,42,30,.14)}
.sl.tk{background:#FCE0EA;border-color:#E0457B}
.choice.ok{background:#EAF5E0;border-color:#3E8E4A}
.blend{left:0;right:0;margin:0 auto;width:fit-content;top:146px;padding:6px 26px 4px;border-radius:24px;background:rgba(255,248,232,.9);box-shadow:0 0 0 3px #B48A5A}
.bpic{left:446px;top:142px;width:124px;height:160px;background:none;border:none;filter:drop-shadow(0 4px 0 rgba(94,59,34,.45))}
.bpic>svg{width:100%;height:100%}
.twcard{border-radius:26px!important}
.twcard.covered{background:repeating-linear-gradient(45deg,#EAF5E0,#EAF5E0 14px,#DCEFD0 14px,#DCEFD0 28px) padding-box,var(--frame) border-box!important}

/* feedback board */
.fb{border-radius:28px!important}
.fb h2{color:var(--ink)}

/* magic mirror page */
.step{background:rgba(255,248,232,.92)}
.lookbar p{background:rgba(255,248,232,.94);border:3px solid #B48A5A;border-radius:16px;padding:10px 26px;box-shadow:0 4px 0 rgba(94,59,34,.35)}

/* the garden behind the question screens */
.backdrop{position:absolute;inset:-12px;overflow:hidden;pointer-events:none;background:#D8EDF4;filter:blur(3px) saturate(.92)}
.backdrop>.bdin{position:absolute;left:12px;top:12px;width:1280px;height:800px}
.backdrop *{animation:none!important;transition:none!important}
.backdrop::after{content:'';position:absolute;inset:0;background:rgba(255,250,236,.3)}
#play.hasbd,#test.hasbd{background:#D8EDF4}

/* practice test on a big board */
.tboard{position:absolute;left:46px;right:46px;top:84px;bottom:6px;border-radius:30px!important}
#test>h1,#test .wnum{color:var(--ink)}

/* garden map: tappable places and small moving things */
.hit{position:absolute;border:none;background:none;padding:0;border-radius:40px;cursor:pointer}
.plaque.arch::after{display:none}
.plaque.arch{padding:3px 24px 4px}.plaque.arch b{font-size:21px}.plaque.arch span{font-size:14px}

function wsWords(n, max) {
  const ok = w => /^[a-z]+$/.test(w) && w.length >= 3 && w.length <= max;
  const g = shuffle([...new Set(gardenWords().map(([, W]) => W.w).filter(ok))]);
  const yr = yrN(), pk = shuffle([...new Set(PK_DATA.filter(p => p[0] === 'y' + Math.max(1, yr) || p[0] === 'y' + Math.max(1, yr - 1)).flatMap(p => p[3].map(e => e[0])).filter(ok))]);
  const out = [];

  return out;
}

  const yr = Math.max(1, yrN()), N = yr <= 1 ? 6 : yr === 2 ? 7 : yr <= 4 ? 8 : 9, cnt = yr <= 1 ? 4 : yr === 2 ? 5 : yr <= 4 ? 6 : 7;
  const dirs = yr >= 3 ? [[0, 1], [1, 0], [1, 1]] : [[0, 1], [1, 0]];
  let words = wsWords(cnt, N), grid, placed;
  for (let tryN = 0; tryN < 30; tryN++) {
    grid = Array.from({ length: N }, () => Array(N).fill('')); placed = [];
    for (const w of [...words].sort((a, b) => b.length - a.length)) {
      for (let t = 0; t < 200; t++) {
        const [dr, dc] = dirs[Math.floor(Math.random() * dirs.length)], r = Math.floor(Math.random() * (N - dr * (w.length - 1))), c = Math.floor(Math.random() * (N - dc * (w.length - 1)));
        if ([...w].every((ch, k) => !grid[r + dr * k][c + dc * k] || grid[r + dr * k][c + dc * k] === ch)) { [...w].forEach((ch, k) => { grid[r + dr * k][c + dc * k] = ch; }); placed.push({ w, r, c, dr, dc }); break; }
      }
    }
    if (placed.length === words.length) break;
  }
  const FILL = 'aaabcdeeeeefghiiiklmnnoooprrssttuuwy';
  grid = grid.map(row => row.map(ch => ch || FILL[Math.floor(Math.random() * FILL.length)]));
  const cs = Math.floor(560 / N);
  S.ws = { N, cs, grid, words: placed.sort((a, b) => words.indexOf(a.w) - words.indexOf(b.w)), found: [], sel: null, tap: null };
  gameScreen('hedge', 'Hedge word search', `<div class="pips" id="wsN"></div>`, `<p class="instr" id="wsI">Find the words hidden in the hedge. ${yr >= 3 ? 'They go across, down or slanting.' : 'They go across or down.'}</p>

   <svg class="wslines" id="wsLines" viewBox="0 0 ${N * cs} ${N * cs}" width="${N * cs}" height="${N * cs}" aria-hidden="true"></svg></div>

      setTimeout(() => { if (S.gh === G && gOn('ghost')) ghSpell(); }, 2300); }

/* ---- Homophone sentences (Year 2 up): a sentence with a gap, read out whole (the choices sound the same, so it gives nothing away).
   Pick the right word; a wrong pick shows a tip. Race the snail across the bottom, or Calm (no timer). Each group: year, tip,
   then word: sentences (_ marks the gap). ---- */
const HOMO = [
  [2, 'their = belongs to them. there = a place (it has "here" in it). they\'re = they are.', { their: ['The children put on _ coats.', 'The birds built _ nest in the hedge.'], there: ['Put the box over _.', 'Is _ any cake left?'], "they're": ['Mum says _ coming for tea.', 'Look at the puppies. _ so sleepy!'] }],

  [2, 'bee = the buzzing insect. be = I will be there.', { bee: ['A _ landed on the flower.', 'The _ made honey.'], be: ['I will _ seven next week.', 'Please _ quiet in the library.'] }],
  [2, 'sun = the bright light in the sky. son = a boy in a family.', { sun: ['The _ is shining today.', 'Wear a hat in the hot _.'], son: ['Their _ is called Sam.', 'The king had a _ and a daughter.'] }],
  [2, 'bear = the animal (it has "ear"). bare = with nothing on it.', { bear: ['The brown _ ate the honey.', 'I hugged my teddy _.'], bare: ['The trees are _ in winter.', 'We ran on the sand in _ feet.'] }],
  [3, 'accept = take something you are given. except = everyone but (x is for "excluding").', { accept: ['Please _ this present.', 'I _ your apology.'], except: ['Everyone came _ Tom.', 'I like all fruit _ bananas.'] }],

  [3, 'great = really good, or very big. grate = rub cheese into small bits.', { great: ['We had a _ time at the beach.', 'That is a _ idea!'], grate: ['Please _ the cheese for the pizza.', 'Dad helped me _ the carrots.'] }],

  [3, 'plane = an aeroplane. plain = simple, with nothing added.', { plane: ['The _ flew high above the clouds.', 'We went to Spain on a _.'], plain: ['I like _ yoghurt best.', 'She wore a _ white T-shirt.'] }],
  [3, 'seen = I have seen it. scene = a part of a play or a view.', { seen: ['Have you _ my shoes?', 'I have never _ a whale.'], scene: ['The first _ of the play was funny.', 'The snowy hills were a beautiful _.'] }],
  [3, 'missed = did not catch or hit (past). mist = light fog.', { missed: ['I _ the bus this morning.', 'He kicked the ball but _ the goal.'], mist: ['The hills were hidden in the _.', 'A thin _ hung over the lake.'] }],

  [3, 'fair = fun rides, or the same for everyone. fare = the money for a bus or train.', { fair: ['We went on the big wheel at the _.', 'It\'s not _ if you push in.'], fare: ['Dad paid the bus _.', 'The train _ went up this year.'] }],

const SNAIL = `<svg viewBox="0 0 90 60" width="90" height="60" aria-hidden="true"><path d="M8 52 C30 56 70 56 84 50 C88 44 80 40 74 42 L70 30" fill="#C9D9A8" stroke="#6E8A4A" stroke-width="3"/><circle cx="44" cy="30" r="22" fill="#D98B5F" stroke="#8C4A2A" stroke-width="3"/><path d="M44 30 m-12 0 a12 12 0 1 0 12 -12 a8 8 0 1 0 6 8" fill="none" stroke="#8C4A2A" stroke-width="3"/><path d="M72 40 L76 22 M78 42 L86 26" stroke="#6E8A4A" stroke-width="3"/><circle cx="76" cy="20" r="3" fill="#3B2A1E"/><circle cx="86" cy="24" r="3" fill="#3B2A1E"/></svg>`;
function startHomo() {
  const y = yrN(), lv = y <= 2 ? [2] : y <= 4 ? [2, 3] : [3, 5], top = lv[lv.length - 1];
  if (S.hoCalm == null) S.hoCalm = y <= 2;
  const groups = HOMO.filter(g => lv.includes(g.y)), qs = [];
  const main = shuffle(groups.filter(g => g.y === top)), more = shuffle(groups.filter(g => g.y !== top)), order = [...main, ...more];
  for (const g of order) { if (qs.length >= 10) break; const w = pickN(Object.keys(g.ws), 1)[0]; qs.push({ g, w, s: pickN(g.ws[w], 1)[0] }); }

  S.ho = { qs: shuffle(qs), i: 0, first: 0, n, limit: n * secs, t0: 0, used: 0 };
  gameScreen('homo', 'Homophone sentences', `<div class="pips" id="hoN"></div>`, `<p class="instr" id="hoI">Which word fits the gap?</p>
   <button class="btn small hocalm" data-act="hoCalm">${S.hoCalm ? 'Snail race: off' : 'Snail race: on'}</button>

}
const hoFill = (s, w) => s.replace('_', w).replace(/^./, c => c.toUpperCase());
function hoQ() {
  const H = S.ho, q = H.qs[H.i]; H.busy = false; H.tries = 0;
  $('#hoN').innerHTML = pipTxt(`${H.i + 1} of ${H.qs.length}`);
  const cap = q.s.startsWith('_');

function hoTick(now) {

function hoPick(b) {
  const H = S.ho; if (!H || H.busy) return; const q = H.qs[H.i], v = b.dataset.v;
  H.busy = true; document.querySelectorAll('#hoCh .hoc').forEach(c => c.classList.add(c.dataset.v === q.w ? 'ok' : c === b ? 'no' : 'dim'));
  const gap = $('#hoGap'); if (gap) { gap.textContent = q.s.startsWith('_') ? q.w[0].toUpperCase() + q.w.slice(1) : q.w; gap.classList.add(v === q.w ? 'ok' : 'fix'); }
  if (v === q.w) { if (!q.again) H.first++; chime(); gwRight(q.w); $('#hoI').textContent = PRZ(); setTimeout(() => { if (S.ho === H && gOn('homo')) hoNext(); }, 1300); return; }
  sweep(320, 140, 0, .14, .05, 'triangle'); $('#hoI').textContent = `Good try. It's ${q.w}.`;
  $('#hoTip').innerHTML = `<b>Remember:</b> ${esc(q.g.tip)}`; $('#hoTip').classList.add('on'); speak([hoFill(q.s, q.w)]);

/* ---- Sunflower tower (Year 2 up): hear a garden word and its sentence, type it. Each right word adds a leaf.

const towerPool = () => gardenWords().filter(([, W]) => /^[A-Za-z'-]{2,16}$/.test(W.w));
const TW_CAN = (full) => `<svg viewBox="0 0 60 44" width="54" height="40" aria-hidden="true"><path d="M10 14 H40 V40 H10 Z" fill="${full ? '#3C86C4' : '#D8E1E8'}" stroke="#2A5F8E" stroke-width="3"/><path d="M40 22 L56 8" stroke="#2A5F8E" stroke-width="4" stroke-linecap="round"/><path d="M16 14 C16 2 34 2 34 14" stroke="#2A5F8E" stroke-width="3" fill="none"/>${full ? '<path d="M14 22 H36" stroke="#8FC1F2" stroke-width="3"/>' : ''}</svg>`;
function startTower() {
  S.tw = null;
  gameScreen('tower', 'Sunflower tower', '<span></span>', `<p class="instr">How tall can your sunflower grow?</p><div class="twpick">
   <button class="twmode" data-act="towerGo" data-m="practice"><b>Practice</b><span>10 words. Each right word adds a leaf, and the flower opens at the top.</span></button>
   <button class="twmode" data-act="towerGo" data-m="champ"><b>Championship</b><span>Keep going until your three watering cans are empty. How tall can it grow?</span></button></div>`);
  speak(['Practice, or Championship?']);
}
function towerGo(b) {

  const order = [...growing, ...grown].map(([k]) => k);
  S.tw = { champ, order, q: champ ? [...order] : order.slice(0, 10), i: 0, leaves: 0, cans: 3, n: 0, first: 0, again: new Set() }; S.tw.goal = S.tw.q.length;
  $('#pbody').className = 'tw';
  $('#pbody').innerHTML = `<p class="instr" id="twI">Listen, then type the word</p><div class="twsky" id="twSky"><div class="twcol" id="twCol"></div></div>
   <div class="twinfo" id="twInfo"></div><button class="speak" data-act="twSay" aria-label="Hear the word again">${I_SPK}</button><div class="speaklbl">Hear it again</div>

function bdRule(p, r, s, word) { // one line on why the spelling changed, or that nothing did

  if (s && r.endsWith('y') && word.includes(r.slice(0, -1) + 'i')) return 'The y changes to i before the ending.';
  if (s && r.endsWith('e') && word.startsWith(p + r.slice(0, -1)) && !word.startsWith(p + r)) return 'The e at the end of the root drops off before the ending.';

/* school test results (grown-ups): right words get a boost, missed ones come back sooner */
function applySchool(G, res) {
  const t = today();
  Object.entries(res).forEach(([k, ok]) => {
    const W = G.words[k]; if (!W) return;
    if (!ok) { missedTest(W, t); return; }
    delete W.pri;
    if (W.st === 3) { if (!W.droop) { W.iv = Math.min(W.iv + 1, GAPS.length - 1); W.due = t + GAPS[W.iv]; } }
    else if (W.lu !== t) { W.st++; W.lu = t; if (W.st === 3) { W.droop = false; W.due = t + GAPS[W.iv]; } }
  });
}

  pkSendNext: () => { const G = getSave(S.gId); const k = G && pkNext(G); if (!k) return; pkSend(G, k); gSave(G); renderGrown(); modal(`<h2>Packet sent</h2><p>${esc(k.title)} is waiting to be planted next time ${esc(G.name)} plays.</p><div class="row"><button class="btn green" data-act="close">OK</button></div>`); },
  pkSendTo: b => { const G = getSave(b.dataset.p), k = pkFind(b.dataset.id); if (!G || !k) return; pkSend(G, k); gSave(G); S.pkOpen = k.id; renderGrown(); modal(`<h2>Packet sent</h2><p>${esc(k.title)} is waiting to be planted next time ${esc(G.name)} plays.</p><div class="row"><button class="btn green" data-act="close">OK</button></div>`); },
  pkDel: b => { const w = pkEdit(b.dataset.id); w.splice(+b.dataset.i, 1); saveRoster(); S.pkOpen = b.dataset.id; renderGrown(); },
  pkAdd: b => { const id = b.dataset.id, wi = $('#pkNew-' + id), v = (wi.value || '').trim(); if (!v) { wi.focus(); return; } const bk = BANK[keyOf(v)]; pkEdit(id).push([v, ($('#pkNewS-' + id).value || '').trim() || (bk && bk.s) || '']); saveRoster(); S.pkOpen = id; renderGrown(); },
  pkOff: b => { const st = pkStore(), id = b.dataset.id; st.ed[id] = st.ed[id] || {}; st.ed[id].off = !st.ed[id].off; saveRoster(); S.pkOpen = id; renderGrown(); },
  pkReset: b => { const st = pkStore(), id = b.dataset.id; ask('Put back the original words for this packet?', 'Put them back', () => { if (st.ed[id]) delete st.ed[id].w; saveRoster(); closeModal(); S.pkOpen = id; renderGrown(); }); },
  pkOwn: () => { const t = ($('#pkOwnT').value || '').trim() || 'Our own words', ws = [...new Set(($('#pkOwnW').value || '').split(/[\s,]+/).map(x => x.trim()).filter(Boolean))].slice(0, BED_MAX); if (!ws.length) { $('#pkOwnW').focus(); return; } const st = pkStore(), id = 'o' + Date.now().toString(36); st.own.push({ id, y: S.pkY, title: t, own: true, p: '', w: ws.map(w => { const bk = BANK[keyOf(w)]; return [w, (bk && bk.s) || '']; }) }); saveRoster(); S.pkOpen = id; renderGrown(); },
  pkOwnDel: b => { ask('Delete this packet?', 'Delete it', () => { const st = pkStore(); st.own = st.own.filter(o => o.id !== b.dataset.id); saveRoster(); closeModal(); renderGrown(); }); },
  pendDel: b => { const G = getSave(S.gId); const pe = G.pending.find(x => x.id === b.dataset.id); if (!pe) return; ask('This list hasn\'t been planted yet. Remove it?', 'Remove it', () => { G.pending = G.pending.filter(x => x !== pe); if (pe.kind === 'list' && !G.schoolTests.some(x => x.list === pe.id)) G.school = G.school.filter(L => L.id !== pe.id); if (pe.kind === 'packet') { const i = Y2P.findIndex(p => p[0].w === pe.words[0].w); G.packetsUsed = G.packetsUsed.filter(x => x !== i); } gSave(G); renderGrown(); }); },
  delExp: b => { const id = b.dataset.id, p = ROSTER.players.find(x => x.id === id); ask(`Delete ${esc(p.name)}'s garden for good?`, 'Delete it', () => { ROSTER.players = ROSTER.players.filter(x => x.id !== id); lsDel(K_PLAYER(id)); saveRoster(); if (P && P.id === id) { P = null; S.back = 'who'; } renderGrown(); }); },
  elsSet: () => { const G = getSave(S.gId), v = +$('#elsSel').value; if (isNaN(v) || v < G.els.start) return; G.els.week = v; recPlantWeeks(G); gSave(G); renderGrown(); modal(`<h2>${weekLabel(v)}</h2><p>Her garden now follows ${weekLabel(v)}. The new sounds and tricky words are waiting as a seed packet: next time she plays, she chooses where to plant them.</p><div class="row"><button class="btn green" data-act="close">OK</button></div>`); },
  dayOn: () => { const G = getSave(S.gId); shiftDays(G, -1); gSave(G); renderGrown(); modal(`<h2>A day has passed</h2><p>${esc(G.name)}'s garden now thinks it's the next day.</p><div class="row"><button class="btn green" data-act="close">OK</button></div>`); },
  seedMore: () => { const G = getSave(S.gId); if (G.seedCheck) { G.seedCheck.day = null; G.seedCheck.count = 0; } gSave(G); renderGrown(); },
  resetG: () => { const G0 = getSave(S.gId); ask(`Empty ${esc(G0.name)}'s garden and start again?`, 'Start again', () => { const G = newSave(G0.name, G0.look, G0.year); G.id = G0.id; G.yrSeen = G.year; gSave(G); renderGrown(); }); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !stage.contains(b)) return;
  if (dragMoved && b.closest('#sceneWrap')) return;
  ac(); const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b, e); }
});
document.addEventListener('submit', e => { if (e.target.id === 'maker') { e.preventDefault(); makerSubmit(); } });
document.addEventListener('change', e => {
  const el = e.target, c = el.dataset.ch; if (!c) return;
  if (c === 'gPick') { S.gId = el.value; draft = null; renderGrown(); }
  else if (c === 'sent') { const G = getSave(S.gId); const W = G.words[el.dataset.k]; if (W) { W.s = el.value.trim(); gSave(G); } }
  else if (c === 'rename') { const v = el.value.trim().slice(0, 16); if (!v) return; const p = ROSTER.players.find(x => x.id === el.dataset.id); const G = getSave(p.id); if (G) { G.name = v; gSave(G); } }
  else if (c === 'rSort') { S.rSort = el.value; renderGrown(); }
  else if (c === 'pkY') { S.pkY = el.value; S.pkOpen = null; renderGrown(); }
  else if (c === 'pkMode') { const G = getSave(S.gId); if (!G) return; G.pkMode = el.value; if (G.pkMode === 'week') G.pkDay = null; if (G.pkMode === 'school') { G.pending = G.pending.filter(pe => pe.kind !== 'packet'); plantAutumn(G); } gSave(G); renderGrown();
    const pb = new Set(G.beds.filter(b => b.kind === 'packet').map(b => b.id)), pw = Object.keys(G.words).filter(k => pb.has(G.words[k].bed));
    if (G.pkMode === 'school' && pw.length) ask(`${esc(G.name)} already has ${pw.length} words from word packets in the garden (${pw.slice(0, 6).map(k => esc(G.words[k].w)).join(', ')}${pw.length > 6 ? '…' : ''}). Take them out, so only school lists grow?`, 'Take them out', () => { const H = getSave(G.id); pw.forEach(k => { if (H.words[k] && pb.has(H.words[k].bed)) delete H.words[k]; }); H.beds = H.beds.filter(b => !pb.has(b.id)); gSave(H); closeModal(); renderGrown(); }); }
  else if (c === 'pkw' || c === 'pks') { const w = pkEdit(el.dataset.id); const r = w[+el.dataset.i]; if (!r) return; const v = el.value.trim(); if (c === 'pkw') { if (!v) return; r[0] = v; } else r[1] = v; saveRoster(); }
  else if (c === 'voice') { DEV.voice = el.value; saveDev(); }
  else if (c === 'rate') { DEV.rate = +el.value; saveDev(); }
  else if (c === 'kb') { DEV.kb = el.value; saveDev(); }
  else if (c === 'dw' || c === 'ds' || c === 'dt') {
    const i = +el.dataset.i; if (!draft || !draft[i]) return;
    if (c === 'dw') { const w = el.value.trim(); draft[i].w = w; const bk = BANK[keyOf(w)]; if (bk && !draft[i].s) draft[i].s = bk.s; draft[i].t = bk && bk.w === w ? bk.t : autoTricky(w, draft.map(x => x.w)); renderGrown(); }
    else if (c === 'ds') draft[i].s = el.value; else draft[i].t = el.value;
  }
});
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea,select')) return;
  if (S.screen !== 'play') return;
  if (S.mode === 'catch' && S.phase === 'catch' && catKey(e)) return;
  if (S.mode === 'ladder' && S.phase === 'g' && /^[a-zA-Z]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); ladKey(e.key.toLowerCase()); return; }
  if (e.key === 'Enter') { e.preventDefault(); if (S.phase === 'look') { if (S.mode === 'twbuild') twReady(); else cover(); } else if (S.phase === 'write') check(); else if (S.phase === 'done') next(); return; }
  if (S.phase !== 'write') return;
  if (S.tb) {
    if (e.key === 'Backspace') { e.preventDefault(); for (let i = S.tb.slots.length - 1; i >= 0; i--) if (S.tb.slots[i] != null) { unplace(i); break; } }
    else if (/^[a-zA-Z'\-]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); const ti = S.tb.tiles.findIndex(t => !t.used && t.c.toLowerCase() === e.key.toLowerCase()); if (ti >= 0) placeTile(ti); }
    return;
  }
  if (e.key === 'Backspace') { e.preventDefault(); ACT.bksp(); }
  else if (/^[a-zA-Z'\-]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); if (S.typed.length < (S.fill ? S.fill.n : 16)) { S.typed += S.cap ? e.key.toUpperCase() : e.key; S.cap = false; drawAns(); } }
});
/* drag to look along the flower garden */
let drag = null, dragMoved = false;
stage.addEventListener('pointerdown', e => { const w = e.target.closest('#sceneWrap'); if (!w || S.gw <= 1280) return; drag = { x: e.clientX, p: S.pan }; dragMoved = false; });
window.addEventListener('pointermove', e => { if (!drag) return; const dx = (e.clientX - drag.x) / S.scale; if (Math.abs(dx) > 8) { dragMoved = true; const sc = $('#scene'); sc.classList.add('drag'); S.pan = Math.max(0, Math.min(drag.p - dx, S.gw - 1280)); sc.style.transform = `translateX(${-S.pan}px)`; hideBubble(); } });
window.addEventListener('pointerup', () => { if (!drag) return; drag = null; const sc = $('#scene'); if (sc) sc.classList.remove('drag'); panButtons(); setTimeout(() => { dragMoved = false; }, 0); });

/* ================= fit to screen ================= */
let turnOk = false;
function fit() {
  const w = innerWidth, h = innerHeight, s = Math.min(w / 1280, h / 800); S.scale = s;
  stage.style.transform = `translate(${(w - 1280 * s) / 2}px,${(h - 800 * s) / 2}px) scale(${s})`;
  $('#turn').classList.toggle('on', !turnOk && h > w * 1.15 && w < 700);
}
$('#turnOk').addEventListener('click', () => { turnOk = true; fit(); });
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250));
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { fit(); setTimeout(fit, 250); }));
fit();
renderWho();
}
</script>
