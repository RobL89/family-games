<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>New game</title>
  <style>
    /* Each game styles itself; the launcher's skins don't reach in here. */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
           font: 600 22px/1.3 system-ui, sans-serif; background: #FFF6E5; color: #2B2118; }
    button { font: inherit; font-size: 26px; padding: 12px 28px; margin: 6px; border-radius: 999px; border: 0;
             background: #2E8FD0; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>New game</h1>
    <p id="who"></p>
    <p id="info"></p>
    <p>Finish with:</p>
    <button type="button" data-stars="1">1 star</button>
    <button type="button" data-stars="2">2 stars</button>
    <button type="button" data-stars="3">3 stars</button>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
