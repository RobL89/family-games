<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rocket Lander</title>
  <link rel="stylesheet" href="../_common/fonts/fredoka.css">
  <link rel="stylesheet" href="../_common/rocket/game.css">
</head>
<body>
  <main id="stage" class="stage">
    <canvas id="scene" class="layer" aria-hidden="true"></canvas>
    <canvas id="fx" class="layer fx" aria-hidden="true"></canvas>

    <header id="hud" class="hud" hidden>
      <div class="ask">
        <div id="target" class="target" role="status" aria-live="polite">
          <span class="target-lbl">Land on</span>
          <b id="target-n" class="chip">7</b>
        </div>
        <button id="say" class="round say" type="button" aria-label="Hear it again" hidden>
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12.5h4.5L16 7v18l-6.5-5.5H5z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M20.5 11.5c1.6 1.2 2.5 2.8 2.5 4.5s-.9 3.3-2.5 4.5M23.8 8c2.7 2 4.2 4.9 4.2 8s-1.5 6-4.2 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="trail">
        <ol id="dots" class="dots" aria-label="Landings"></ol>
        <div id="rocks" class="rocks" aria-label="Moon rocks">
          <canvas class="rock-icon" width="56" height="56" aria-hidden="true"></canvas><span id="rocks-n">0</span>
        </div>
      </div>
    </header>

    <div id="bubble" class="bubble" hidden></div>

    <section id="start" class="card start" aria-labelledby="title">
      <div class="brand">
        <canvas id="hero" class="hero" width="200" height="260" aria-hidden="true"></canvas>
        <h1 id="title" class="title" aria-label="Rocket Lander"><span class="w1">Rocket</span><span class="w2">Lander</span></h1>
      </div>
      <div class="pick">
        <ul id="planets" class="planets" aria-label="Planets"></ul>
        <div class="start-foot">
          <button id="hangar" class="hangar-btn" type="button" aria-label="Hangar: your ships and moon rocks">
            <span class="door-wrap" aria-hidden="true">
              <svg class="door-svg" viewBox="0 0 100 120">
                <defs>
                  <linearGradient id="dg-in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1F6B"/><stop offset="1" stop-color="#8CF5FF"/></linearGradient>
                  <pattern id="dg-haz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFC93C"/><rect width="6" height="12" fill="#1B1446"/></pattern>
                </defs>
                <path d="M8 116V44Q8 10 50 10Q92 10 92 44V116Z" fill="#5B4CC4" stroke="#1B1446" stroke-width="5" stroke-linejoin="round"/>
                <path d="M20 112V48Q20 24 50 24Q80 24 80 48V112Z" fill="url(#dg-in)" stroke="#1B1446" stroke-width="4"/>
                <g class="shutter">
                  <path d="M20 48Q20 24 50 24Q80 24 80 48V50H20Z" fill="#B9B3E6" stroke="#1B1446" stroke-width="4" stroke-linejoin="round"/>
                  <path d="M24 36H76M21 44H79" stroke="#1B1446" stroke-width="2.5" opacity=".55"/>
                  <rect x="20" y="46" width="60" height="7" fill="url(#dg-haz)" stroke="#1B1446" stroke-width="3"/>
                </g>
                <rect x="4" y="110" width="92" height="9" rx="4" fill="url(#dg-haz)" stroke="#1B1446" stroke-width="4"/>
                <circle class="beacon" cx="50" cy="9" r="7" fill="#FF5D73" stroke="#1B1446" stroke-width="4"/>
              </svg>
              <canvas id="door-ship" class="door-ship" width="140" height="190"></canvas>
            </span>
            <span class="rocks big-rocks" aria-label="Moon rocks">
              <canvas class="rock-icon" width="72" height="72" aria-hidden="true"></canvas><span id="start-rocks">0</span>
            </span>
          </button>
          <button id="play" class="big go" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            Play
          </button>
        </div>
      </div>
    </section>

    <section id="end" class="card end" hidden aria-labelledby="end-h">
      <div class="end-main">
        <h2 id="end-h" class="cheer">Super landing!</h2>
        <div id="end-stars" class="stars"></div>
        <p id="end-p" class="did"></p>
      </div>
      <div id="unlock" class="unlock" hidden>
        <canvas id="unlock-ball" width="200" height="200" aria-hidden="true"></canvas>
        <p><span>New planet!</span> <b id="unlock-name">Red Dust</b></p>
      </div>
      <div class="row">
        <button id="again" class="big go" type="button">Play again</button>
        <button id="done" class="big alt" type="button">Done</button>
      </div>
    </section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
