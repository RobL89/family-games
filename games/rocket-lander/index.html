<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rocket Lander</title>
  <link rel="stylesheet" href="../_common/fonts/fredoka.css">
  <link rel="stylesheet" href="../_common/rocket/game.css">
</head>
<body>
  <main id="stage" class="stage">
    <canvas id="scene" class="layer" aria-hidden="true"></canvas>
    <canvas id="starmap" class="layer starmap" aria-hidden="true"></canvas>
    <canvas id="fx" class="layer fx" aria-hidden="true"></canvas>

    <header id="hud" class="hud" hidden>
      <div class="ask">
        <div id="target" class="target" role="status" aria-live="polite">
          <span class="target-lbl">Land on</span>
          <b id="target-n" class="chip">7</b>
        </div>
        <button id="say" class="round say" type="button" aria-label="Hear it again" hidden>
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12.5h4.5L16 7v18l-6.5-5.5H5z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M20.5 11.5c1.6 1.2 2.5 2.8 2.5 4.5s-.9 3.3-2.5 4.5M23.8 8c2.7 2 4.2 4.9 4.2 8s-1.5 6-4.2 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="trail">
        <ol id="dots" class="dots" aria-label="Landings"></ol>
        <div id="rocks" class="rocks" aria-label="Moon rocks">
          <canvas class="rock-icon" width="56" height="56" aria-hidden="true"></canvas><span id="rocks-n">0</span>
        </div>
      </div>
    </header>

    <div id="bubble" class="bubble" hidden></div>

    <!-- The map is home (D-066): the system the child is in, its levels, and the rocket by its place. -->
    <section id="map" class="map" aria-label="Map">
      <nav id="map-bar" class="map-bar" aria-label="Systems">
        <button id="to-galaxy" class="round galaxy-btn" type="button" aria-label="Galaxy: all the systems">
          <svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="20" rx="16" ry="7" transform="rotate(-24 20 20)" fill="none" stroke="currentColor" stroke-width="3.2"/><circle cx="20" cy="20" r="7.5" fill="#FFC93C" stroke="currentColor" stroke-width="3"/><circle cx="31" cy="9" r="2.4" fill="currentColor"/><circle cx="8" cy="31" r="1.8" fill="currentColor"/></svg>
        </button>
        <div class="sys">
          <button id="sys-prev" class="round step-btn" type="button" aria-label="The system before"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h1 class="sys-title"><span id="sys-name" class="sys-name">Moon</span><span id="sys-of" class="sys-of">system 1 of 6</span></h1>
          <button id="sys-next" class="round step-btn" type="button" aria-label="The system after"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <button id="hangar" class="hangar-btn" type="button" aria-label="Hangar: your ships and moon rocks">
          <span class="door-wrap" aria-hidden="true">
            <svg class="door-svg" viewBox="0 0 100 120">
              <defs>
                <linearGradient id="dg-in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1F6B"/><stop offset="1" stop-color="#8CF5FF"/></linearGradient>
                <pattern id="dg-haz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFC93C"/><rect width="6" height="12" fill="#1B1446"/></pattern>
              </defs>
              <path d="M8 116V44Q8 10 50 10Q92 10 92 44V116Z" fill="#5B4CC4" stroke="#1B1446" stroke-width="5" stroke-linejoin="round"/>
              <path d="M20 112V48Q20 24 50 24Q80 24 80 48V112Z" fill="url(#dg-in)" stroke="#1B1446" stroke-width="4"/>
              <g class="shutter">
                <path d="M20 48Q20 24 50 24Q80 24 80 48V50H20Z" fill="#B9B3E6" stroke="#1B1446" stroke-width="4" stroke-linejoin="round"/>
                <path d="M24 36H76M21 44H79" stroke="#1B1446" stroke-width="2.5" opacity=".55"/>
                <rect x="20" y="46" width="60" height="7" fill="url(#dg-haz)" stroke="#1B1446" stroke-width="3"/>
              </g>
              <rect x="4" y="110" width="92" height="9" rx="4" fill="url(#dg-haz)" stroke="#1B1446" stroke-width="4"/>
              <circle class="beacon" cx="50" cy="9" r="7" fill="#FF5D73" stroke="#1B1446" stroke-width="4"/>
            </svg>
            <canvas id="door-ship" class="door-ship" width="140" height="190"></canvas>
          </span>
          <span class="rocks big-rocks" aria-label="Moon rocks">
            <canvas class="rock-icon" width="72" height="72" aria-hidden="true"></canvas><span id="map-rocks">0</span>
          </span>
        </button>
      </nav>
      <div id="marks" class="marks"></div>
      <button id="play" class="play-bubble" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        Play
      </button>
      <p id="banner" class="banner" role="status" hidden></p>
    </section>

    <!-- The galaxy (D-065): every system along a winding path. -->
    <section id="galaxy-view" class="galaxy-view" aria-labelledby="gx-h" hidden>
      <div class="gx-head">
        <button id="gx-back" class="round" type="button" aria-label="Back to the map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 id="gx-h" class="gx-title">Your galaxy</h2>
      </div>
      <div id="gx-orbs" class="gx-orbs"></div>
    </section>

    <!-- A level's card: what it asks, its best stars and the rocks found there (sketches 1, section 2). -->
    <div id="lc-back" class="lc-back" hidden></div>
    <section id="level-card" class="card level-card" hidden aria-labelledby="lc-h">
      <button id="lc-close" class="round lc-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>
      </button>
      <p id="lc-sys" class="lc-sys">Moon</p>
      <h2 id="lc-h" class="lc-title">Level 1</h2>
      <p id="lc-about" class="lc-about"></p>
      <p class="lc-sample"><span>Land on</span> <b id="lc-chip" class="chip">3</b></p>
      <div id="lc-stars" class="stars lc-stars"></div>
      <div id="lc-rocks" class="slots"></div>
      <p id="lc-note" class="lc-note"></p>
      <button id="lc-play" class="big go" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        Play
      </button>
    </section>

    <!-- The one-time track pick (D-121): inside the wrapper, for a child with no progress yet (trackpick.js). -->
    <section id="track-pick" class="card track-pick" hidden aria-labelledby="tp-h">
      <h2 id="tp-h" class="cheer">Which path?</h2>
      <p class="tp-note">Grown-ups: pick once for <b id="tp-name">this child</b>.</p>
      <div id="tp-row" class="row tp-row"></div>
    </section>

    <section id="end" class="card end" hidden aria-labelledby="end-h">
      <div class="end-main">
        <p id="end-done" class="end-done" hidden></p>
        <h2 id="end-h" class="cheer">Super landing!</h2>
        <div id="end-stars" class="stars"></div>
        <p id="end-p" class="did"></p>
        <div id="end-rocks" class="slots"></div>
        <p id="end-rocks-p" class="rocks-p"></p>
      </div>
      <div id="unlock" class="unlock" hidden>
        <canvas id="unlock-ball" width="200" height="200" aria-hidden="true"></canvas>
        <p><span id="unlock-lbl">Open now!</span> <b id="unlock-name">Level 2</b></p>
      </div>
      <div class="row">
        <button id="to-map" class="big go" type="button">Map</button>
        <button id="again" class="big alt" type="button">Play again</button>
      </div>
    </section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
