<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bubble pop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <main id="stage" class="stage">
    <div class="hud" aria-live="polite"><span id="count">0</span> / <span id="total">20</span></div>

    <section id="start" class="card">
      <h1>Bubble pop</h1>
      <p>Pop the bubbles before they float away!</p>
      <button id="play" class="big" type="button">Play</button>
    </section>

    <section id="end" class="card" hidden>
      <h1 id="end-h">Hooray!</h1>
      <div id="end-stars" class="stars"></div>
      <p id="end-p"></p>
      <div class="row">
        <button id="again" class="big" type="button">Play again</button>
        <button id="done" class="big alt" type="button">Done</button>
      </div>
    </section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
