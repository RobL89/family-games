<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hamster Highway</title>
  <link rel="stylesheet" href="../_common/fonts/fredoka.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" class="stage">
    <section id="title" class="screen title">
      <svg id="title-art" class="title-art" viewBox="0 0 600 340" aria-hidden="true"></svg>
      <button id="play" class="play" type="button" aria-label="Play">
        <svg viewBox="0 0 60 60" aria-hidden="true"><path d="M 22 15 L 22 45 L 46 30 Z" fill="#fff" stroke="#1B1446" stroke-width="4" stroke-linejoin="round"/></svg>
      </button>
    </section>

    <section id="house" class="screen house" hidden>
      <div id="house-scroll" class="house-scroll"><svg id="house-svg" viewBox="0 0 2420 900" aria-label="The house and garden: pick a level"></svg></div>
      <div class="house-hud">
        <div id="seeds" class="pill" aria-label="Golden seeds found"></div>
        <button id="sound" class="round" type="button" aria-label="Sound on or off"></button>
      </div>
    </section>

    <section id="level" class="screen level" hidden>
      <svg id="board" viewBox="0 0 720 530" aria-label="Level">
        <defs><clipPath id="window"><rect x="0" y="0" width="720" height="420"/></clipPath></defs>
        <g clip-path="url(#window)"><g id="world"><g id="bg"></g><g id="fits"></g><g id="gads"></g><g id="parts"></g><g id="seedl"></g><g id="ghost"></g><g id="walkers"></g><g id="fx"></g></g></g>
        <g id="pfx"></g><g id="hud"></g><g id="arrows"></g><g id="tray"></g><g id="drag"></g>
      </svg>
      <div id="party" class="party" hidden>
        <button type="button" class="round big" data-act="house" aria-label="Back to the house">
          <svg viewBox="0 0 60 60" aria-hidden="true"><path d="M 12 30 L 30 13 L 48 30" fill="none" stroke="#1B1446" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="18" y="28" width="24" height="18" rx="3" fill="#E7B26F" stroke="#1B1446" stroke-width="3.5"/><rect x="26" y="34" width="8" height="12" rx="2" fill="#5A3A22"/></svg>
        </button>
        <button type="button" class="round big" data-act="again" aria-label="Play this level again">
          <svg viewBox="0 0 60 60" aria-hidden="true"><path d="M 18 22 A 15 15 0 1 1 17 38" fill="none" stroke="#1B1446" stroke-width="5" stroke-linecap="round"/><path d="M 10 14 L 18 24 L 28 17" fill="none" stroke="#1B1446" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="round big next" data-act="next" aria-label="Next level">
          <svg viewBox="0 0 60 60" aria-hidden="true"><path d="M 22 15 L 22 45 L 46 30 Z" fill="#fff" stroke="#1B1446" stroke-width="4" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button id="turn" class="turn" type="button" aria-label="Turn the phone on its side" hidden>
        <svg viewBox="0 0 120 120" aria-hidden="true"><g class="tilt"><rect x="38" y="20" width="44" height="80" rx="9" fill="#FFF8EE" stroke="#1B1446" stroke-width="5"/><circle cx="60" cy="88" r="4" fill="#1B1446"/></g><path d="M 98 46 A 40 40 0 0 1 86 96" fill="none" stroke="#F0A51C" stroke-width="6" stroke-linecap="round"/><path d="M 78 92 L 87 98 L 92 88" fill="none" stroke="#F0A51C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
